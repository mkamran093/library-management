# ---------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------
server.port=8080

# ---------------------------------------------------------------------------
# MySQL DataSource (consumed by JdbcTemplate - no ORM/Hibernate involved)
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/library_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------------------------
# Run schema.sql / data.sql automatically on startup against the datasource above
# ---------------------------------------------------------------------------
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging.level.com.example.library=DEBUG
logging.level.org.springframework.jdbc.core=DEBUG